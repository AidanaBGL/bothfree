<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bothfree — UI Concept</title><style>
:root{--bg:#f7f6f3;--ink:#173e32;--muted:#64776d;--green:#245a46;--line:#dbe3d9;--pill:#edf2eb;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#f0f1ee;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px}.app{max-width:1440px;min-height:100vh;margin:auto;background:var(--bg);border-radius:28px;overflow:hidden}.top{height:104px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:30px;padding:0 40px}.logo{font-weight:800;font-size:32px;letter-spacing:-1.6px;white-space:nowrap}.logo span{font-weight:500;color:#7a8c80}.arrow{font-size:38px;font-weight:200;display:inline-block;margin-left:8px;vertical-align:middle}.tag,.disclaimer,.eyebrow,.small{color:var(--muted)}.tag{font-size:16px;white-space:nowrap}.disclaimer{margin-left:auto;font-size:16px}.layout{display:grid;grid-template-columns:294px minmax(0,1fr);min-height:calc(100vh - 168px)}aside{border-right:1px solid var(--line);padding:46px 19px 35px}nav{display:flex;flex-direction:column;gap:8px}.group{color:var(--muted);font-size:15px;letter-spacing:1.7px;text-transform:uppercase;margin:24px 16px 9px}.group:first-child{margin-top:0}.navitem{width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:17px 16px;color:var(--ink);font:inherit;font-size:18px;cursor:pointer;transition:.2s}.navitem:hover{background:#e8eee6;transform:translateX(3px)}.navitem.active{background:var(--green);color:white}.content{padding:40px 38px 60px;max-width:1080px;width:100%;margin:auto}.meta{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:16px;margin-bottom:31px}.hero h1{font-size:clamp(32px,4.1vw,49px);line-height:1.08;letter-spacing:-2px;color:#101010;margin:0 0 22px;max-width:710px}.subtitle{font-size:21px;color:var(--muted);margin:0 0 30px}.flow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:36px}.flow span{padding:15px 17px;border-radius:13px;background:var(--pill);white-space:nowrap}.flow b{font-size:25px;font-weight:300;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:var(--white);border:1px solid var(--line);border-radius:26px;padding:33px 33px 38px;min-height:480px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-5px);box-shadow:0 15px 35px #183e3212}.card h2{color:#101010;font-size:24px;line-height:1.4;margin:0 0 10px}.card p{color:var(--muted);font-size:20px;line-height:1.5;margin:0 0 35px}.pills{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.pill{background:var(--pill);border:1px solid var(--line);padding:14px 17px;border-radius:27px;font-size:16px;line-height:1.4;color:var(--ink)}.note{margin-top:25px;background:var(--pill);border-radius:18px;padding:22px;color:var(--muted);line-height:1.5}.actions{display:flex;justify-content:space-between;gap:15px;margin-top:33px}.btn{border:1px solid var(--line);border-radius:14px;padding:19px 26px;background:white;color:var(--ink);font:inherit;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 7px 16px #0000000b}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.footer{padding:23px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:16px}.detail{animation:enter .3s ease both}.detail h1{font-size:clamp(32px,4vw,50px);color:#111;letter-spacing:-1.5px;margin:0 0 12px}.detail p{font-size:20px;line-height:1.6;color:var(--muted);max-width:720px}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:30px;margin-top:28px}.panel h2{margin-top:0;color:#151515}.options{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.choice{padding:14px 19px;border-radius:15px;background:var(--pill);border:1px solid var(--line);font:inherit;color:var(--ink);cursor:pointer}.choice.selected{background:var(--green);color:white}.field{width:100%;max-width:440px;padding:15px;border-radius:12px;border:1px solid var(--line);font:inherit;margin-top:12px}.fade{animation:enter .35s ease both}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.top{gap:18px;padding:0 24px}.disclaimer{display:none}.layout{grid-template-columns:230px 1fr}.content{padding:30px 24px}.card{padding:24px 20px;min-height:430px}.card h2{font-size:21px}.card p{font-size:17px}.navitem{font-size:16px}}@media(max-width:700px){.app{border-radius:0}.top{height:auto;min-height:86px;flex-wrap:wrap;padding:18px}.logo{font-size:28px}.tag{font-size:12px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px;overflow-x:auto}nav{display:flex;flex-direction:row;width:max-content;gap:6px}.group{display:none}.navitem{width:auto;white-space:nowrap;font-size:14px;padding:12px}.content{padding:26px 18px 40px}.meta{font-size:13px}.hero h1{letter-spacing:-1.3px}.subtitle{font-size:18px}.flow span{padding:10px 12px;font-size:14px}.cards{grid-template-columns:1fr}.card{min-height:0;padding:24px}.card p{margin-bottom:20px}.pills{margin-top:0}.note{font-size:15px}.actions .btn{font-size:14px;padding:15px}.footer{padding:20px;font-size:13px}}
</style></head><body><div class="app"><header class="top"><div class="logo">both<span>free</span><span class="arrow">↗</span></div><div class="tag">MAKE TIME. MEET PEOPLE.</div><div class="disclaimer">Концепция интерфейса · данные вымышлены</div></header><div class="layout"><aside><nav id="nav"></nav></aside><main class="content" id="main"></main></div><footer class="footer">Макет для обсуждения · почта, геолокация, платежи и подбор здесь не подключены</footer></div><script>
const pages=['Карта страниц','Главная','Регистрация','Код из письма','Три сценария','Календарь','Занятия','Район встречи','Бюджет и счёт','Приглашение','Новые знакомства','Совпадение и план','Premium','Мои встречи'];const groups=[['ОБЗОР',0,1],['ВХОД',2,3],['ПРЕДПОЧТЕНИЯ',4,8],['ВСТРЕЧА',9,11],['АККАУНТ',12,13]];let current=0;const selections={};const main=document.getElementById('main');function nav(){document.getElementById('nav').innerHTML=groups.map(([g,a,b])=>`<div class="group">${g}</div>`+pages.slice(a,b+1).map((p,i)=>`<button class="navitem ${current===a+i?'active':''}" onclick="go(${a+i})">${String(a+i).padStart(2,'0')} · ${p}</button>`).join('')).join('')}function go(n){current=Math.max(0,Math.min(13,n));nav();render();window.scrollTo({top:0,behavior:'smooth'})}function controls(){return `<div class="actions"><button class="btn" onclick="go(${Math.max(0,current-1)})">← Back</button><button class="btn primary" onclick="go(${Math.min(13,current+1)})">${current===0?'Посмотреть экраны':'Продолжить'} →</button></div>`}function overview(){return `<div class="fade"><div class="meta"><span>Карта страниц</span><span>WEB · US · 25–45</span></div><section class="hero"><h1>От свободного времени<br>к реальной встрече.</h1><p class="subtitle">Одна общая анкета. Три понятных маршрута.</p></section><div class="flow"><span>Главная</span><b>→</b><span>Аккаунт + код</span><b>→</b><span>Выбор сценария</span></div><div class="cards"><article class="card"><h2>Пригласить<br>знакомого</h2><p>Календарь → занятие → район → бюджет</p><div class="pills"><div class="pill">Ссылка →<br>ответ участника</div><div class="pill">Пересечения →<br>подтверждение</div></div></article><article class="card"><h2>Найти друга</h2><p>Общие шаги + разделение счёта + профиль</p><div class="pills"><div class="pill">Анкеты →<br>взаимный интерес</div><div class="pill">Общий план →<br>подтверждение</div></div></article><article class="card"><h2>Найти пару</h2><p>Общие шаги + разделение счёта + dating-предпочтения</p><div class="pills"><div class="pill">Анкеты →<br>взаимный лайк</div><div class="pill">Свидание →<br>подтверждение</div></div></article></div><div class="note">Демо для жюри: вход без аккаунта → любой сценарий. Регистрация доступна отдельным маршрутом.</div>${controls()}</div>`}
const configs={1:['Главная','MAKE TIME. MEET PEOPLE.','Найдите время для настоящих встреч.',['Пригласить знакомого','Найти друга','Найти пару']],2:['Регистрация','Создайте аккаунт','Укажите почту, чтобы сохранить ваши планы.',['Продолжить с email']],3:['Код из письма','Подтвердите email','Введите код подтверждения. В демо подойдёт любой код.',['Подтвердить']],4:['Три сценария','Что вы хотите сделать?','Выберите цель встречи.',['Пригласить знакомого','Найти друга','Найти пару']],5:['Календарь','Когда вы свободны?','Выберите удобные дни для встречи.',['Пн','Вт','Ср','Чт','Пт','Сб','Вс']],6:['Занятия','Чем займёмся?','Выберите занятия, которые вам нравятся.',['☕ Кофе','🍝 Еда','🎨 Творчество','🎬 Кино','🏃 Спорт','🌳 Прогулка']],7:['Район встречи','Где вам удобно?','Выберите подходящий район.',['Манхэттен','Бруклин','Квинс','Любой район']],8:['Бюджет и счёт','Какой бюджет?','Согласуйте комфортные расходы.',['До $20','$20–40','$40–70','$70+','Разделить счёт','Я угощаю']],9:['Приглашение','Пригласите человека','Отправьте ссылку, чтобы найти общее время.',['Скопировать приглашение']],10:['Новые знакомства','Найдите интересных людей','В демо доступны примерные варианты.',['Интересно','Пропустить','Посмотреть профиль']],11:['Совпадение и план','У вас совпадение!','Выберите план и подтвердите встречу.',['Подтвердить встречу','Предложить другое время']],12:['Premium','Больше возможностей','Дополнительные фильтры и инструменты планирования.',['Попробовать Premium']],13:['Мои встречи','Ваши встречи','Все подтверждённые планы в одном месте.',['Новая встреча']]};function choose(n,i){selections[n]??=[];const pos=selections[n].indexOf(i);pos>=0?selections[n].splice(pos,1):selections[n].push(i);render()}function render(){if(current===0){main.innerHTML=overview();return}const [label,title,desc,opts]=configs[current];main.innerHTML=`<div class="detail"><div class="meta"><span>${label}</span><span>${String(current).padStart(2,'0')} / 13</span></div><h1>${title}</h1><p>${desc}</p><div class="panel"><h2>${label}</h2>${current===2?'<input class="field" type="email" placeholder="you@example.com" aria-label="Email">':''}${current===3?'<input class="field" inputmode="numeric" placeholder="123456" aria-label="Код">':''}<div class="options">${opts.map((o,i)=>`<button class="choice ${(selections[current]||[]).includes(i)?'selected':''}" onclick="choose(${current},${i})">${o}</button>`).join('')}</div>${current===9?'<p><button class="btn" onclick="navigator.clipboard?.writeText(location.href).then(()=>alert(\'Ссылка скопирована\'))">📋 Копировать ссылку на демо</button></p>':''}<p class="small">Интерактивный концепт · выбранные параметры сохраняются до перезагрузки страницы.</p></div>${controls()}</div>`}nav();render();
</script></body></html>
