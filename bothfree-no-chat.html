так<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BothFree — интерактивный прототип</title>
  <style>
    :root{--bg:#f5f6fb;--ink:#202438;--muted:#7b8194;--violet:#7255ec;--violet2:#f0ecff;--line:#e7e8f0;--white:#fff;--pink:#fa658d;--green:#22af80;--shadow:0 16px 42px #24274d12}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit} .app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:28px 17px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:28px;font-weight:900;letter-spacing:-1.4px;padding:0 14px 20px}.brand span{color:var(--violet)}.nav-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#a0a4b4;padding:17px 14px 10px;font-weight:800}.nav-item{display:flex;align-items:center;gap:11px;text-align:left;width:100%;border:0;border-radius:12px;background:transparent;color:#62687b;font-weight:650;font-size:13px;padding:12px;margin:2px 0}.nav-item:hover{background:#f6f4ff}.nav-item.active{background:var(--violet2);color:var(--violet)}.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#f0f1f6;color:#8990a4;font-size:11px;flex-shrink:0}.active .num{background:var(--violet);color:#fff}.main{padding:32px clamp(18px,4vw,64px)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1080px;margin:0 auto 24px}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase;color:var(--violet)}.topbar small{color:var(--muted)}.viewport{max-width:1080px;margin:auto;background:#fff;border-radius:24px;box-shadow:var(--shadow);min-height:680px;overflow:hidden}.screen{padding:clamp(26px,5vw,65px);min-height:680px;display:flex;flex-direction:column}.screen.center{align-items:center;justify-content:center;text-align:center}.screen h1{font-size:clamp(30px,4vw,52px);line-height:1.08;letter-spacing:-2px;margin:16px 0}.screen h2{font-size:clamp(25px,3vw,36px);letter-spacing:-1.3px;margin:8px 0 13px}.screen h3{margin:0 0 8px}.lead{color:var(--muted);line-height:1.65;max-width:590px;margin:0 0 25px}.center .lead{margin:0 auto 26px}.pill{display:inline-flex;gap:6px;align-items:center;padding:8px 13px;background:#f1edff;color:var(--violet);border-radius:99px;font-weight:800;font-size:11px}.btn{border:0;padding:13px 21px;border-radius:12px;background:var(--violet);color:white;font-weight:800;box-shadow:0 6px 17px #7255ec24}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#f0ecff;color:var(--violet);box-shadow:none}.btn.ghost{background:white;color:#5c6078;border:1px solid var(--line);box-shadow:none}.btn.dark{background:var(--ink)}.buttons{display:flex;gap:11px;flex-wrap:wrap;margin-top:23px}.center .buttons{justify-content:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:25px 0}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{border:1px solid var(--line);background:white;border-radius:18px;padding:23px;text-align:left;transition:.2s;min-width:0}.tile.selectable{cursor:pointer}.tile.selectable:hover,.tile.selected{border-color:var(--violet);box-shadow:0 0 0 3px #7255ec10;transform:translateY(-2px)}.tile h3{font-size:17px}.tile p{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0 0}.emoji{font-size:34px;margin-bottom:15px}.mini{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:8px;margin:13px 0}.field label{font-weight:750;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #e3e5ef;border-radius:12px;padding:14px 15px;background:#fff;color:var(--ink);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet)}.form{max-width:525px;width:100%}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.check{display:flex;align-items:center;gap:10px;font-size:13px;color:#646b7d;margin:12px 0}.check input{accent-color:var(--violet)}.tag{border:1px solid var(--line);border-radius:99px;padding:10px 14px;background:white;font-size:12px;font-weight:700;color:#555d71}.tag.on{background:var(--violet);color:#fff;border-color:var(--violet)}.divider{height:1px;background:var(--line);margin:20px 0}.hero-orbit{height:180px;width:180px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fce4fa,#d6cbff 55%,#8f79f4);display:grid;place-items:center;font-size:85px;box-shadow:0 28px 65px #7255ec35;margin:23px auto}.stepper{display:flex;gap:8px;margin:13px 0 22px}.stepper span{height:5px;width:40px;border-radius:10px;background:#e9e8f1}.stepper .done{background:var(--violet)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:690px}.day{text-align:center;font-size:11px;font-weight:750;color:#a1a4b4;padding-bottom:8px}.date{border:1px solid var(--line);border-radius:12px;min-height:62px;background:#fff;color:#565b70;font-weight:750}.date:hover{border-color:var(--violet)}.date.on{background:var(--violet2);border-color:var(--violet);color:var(--violet)}.date:disabled{opacity:.3;cursor:not-allowed}.slots{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.profile{display:flex;gap:15px;align-items:center}.avatar{height:58px;width:58px;flex-shrink:0;display:grid;place-items:center;background:#ece6ff;border-radius:16px;font-size:30px}.person{border:1px solid var(--line);padding:18px;border-radius:17px}.person p{font-size:12px;color:var(--muted);line-height:1.5}.mapbox{position:relative;min-height:300px;background:linear-gradient(110deg,transparent 0 46%,#eef0ef 46% 51%,transparent 51%),linear-gradient(30deg,#faf9ff,#f2f4fa);border-radius:20px;border:1px solid var(--line);overflow:hidden}.mapbox:before,.mapbox:after{content:"";position:absolute;background:#e5e2f0;transform:rotate(-29deg);width:130%;height:18px;top:34%;left:-20%}.mapbox:after{transform:rotate(55deg);top:68%;background:#dedce9}.pin{position:absolute;z-index:1;border-radius:40px;background:var(--violet);color:white;padding:10px 13px;box-shadow:0 7px 21px #7255ec30;font-weight:800;font-size:12px}.pin.a{top:29%;left:19%}.pin.b{top:55%;left:56%;background:var(--pink)}.pin.c{top:15%;left:63%;background:#24af83}.summary{background:#f7f5ff;border-radius:18px;padding:22px;margin:20px 0}.summary p{font-size:14px;line-height:1.8;margin:5px 0}.notice{padding:14px 18px;border-radius:12px;background:#eef9f3;color:#177a58;font-size:13px;line-height:1.5;margin-top:15px}.warn{background:#fff6e8;color:#8b6218}.progress{display:flex;justify-content:space-between;gap:7px;padding-top:18px;max-width:1080px;margin:auto}.progress button{border:0;background:transparent;color:#73798f;font-size:12px;font-weight:700}.footer{font-size:11px;text-align:center;color:#a1a6b7;margin-top:20px}.switch{display:flex;background:#f3f2f8;padding:5px;border-radius:13px;width:max-content;gap:5px}.switch button{border:0;background:transparent;padding:10px 14px;border-radius:9px;font-size:12px;font-weight:750;color:#7b8194}.switch .on{background:white;color:var(--violet);box-shadow:0 2px 6px #0000000e}.hidden{display:none!important}.screen-enter{animation:appear .25s ease}@keyframes appear{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:850px){.app{display:block}.sidebar{position:relative;height:auto;padding:13px 14px}.brand{display:inline-block;font-size:22px;padding:8px 14px}.nav-label{display:none}.nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:5px}.nav-item{width:auto;white-space:nowrap;margin:0}.main{padding:18px}.screen{min-height:580px}.grid{grid-template-columns:1fr}.grid.two{grid-template-columns:1fr}.viewport{border-radius:17px}.topbar{margin-bottom:13px}}@media(max-width:480px){.screen{padding:25px 20px}.calendar{gap:4px}.date{min-height:45px;border-radius:8px;font-size:11px}.day{font-size:9px}.hero-orbit{height:140px;width:140px;font-size:60px}.screen h1{letter-spacing:-1px}.pin{font-size:10px;padding:8px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar"><div class="brand">both<span>free</span><span style="font-size:10px;vertical-align:top;margin-left:5px;color:#9da0b2">BETA</span></div><div class="nav-label">13 экранов прототипа</div><nav id="nav" class="nav"></nav></aside>
    <main class="main"><div class="topbar"><div><div class="eyebrow">Interactive product prototype</div><small id="breadcrumb">Экран 1 из 13</small></div><button class="btn ghost" id="resetBtn">↻ Сбросить демо</button></div><div class="viewport" id="viewport"></div><div class="progress"><button id="prev">← Назад</button><small class="mini">BothFree · демонстрационный прототип</small><button id="next">Далее →</button></div><p class="footer">Демонстрационная версия. Отправка приглашений, карты, подбор людей и оплата не подключены к серверу.</p></main>
  </div>
  <script>
    const titles=['Приветствие','Выбор сценария','Вход и регистрация','Профиль','Интересы','Свободное время','Пригласить знакомого','Поиск друзей','Поиск пары','Подбор людей','Карточка встречи','Место на карте','Подтверждение'];
    const S={page:0,mode:'friend',name:'',email:'',city:'Астана',age:'',bio:'',interests:['Кофе','Прогулки'],days:[18,21],time:'18:00',selectedPerson:0,place:0,inviteEmail:'',auth:false,jury:false,confirmed:false,payment:false};
    const people=[{name:'Алия',age:25,emoji:'👩🏻',info:'Любит уютные кофейни, книги и пешие прогулки',common:'Кофе · Прогулки',score:'92%'},{name:'Данияр',age:27,emoji:'🧑🏻',info:'Дизайн, городские маршруты и новые знакомства',common:'Прогулки · Искусство',score:'89%'},{name:'Мадина',age:24,emoji:'👩🏽',info:'Музыка, выставки и интересные разговоры',common:'Музыка · Кофе',score:'86%'}];
    const venues=[{name:'Кофейня в центре',description:'Тихое место для первого разговора',icon:'☕'},{name:'Городской парк',description:'Встреча на свежем воздухе',icon:'🌳'},{name:'Арт-пространство',description:'Выставка и непринужденное общение',icon:'🎨'}];
    const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const button=(text,page,style='')=>`<button class="btn ${style}" data-go="${page}">${text}</button>`;
    const intro=(label,title,desc)=>`<div class="eyebrow">${label}</div><h2>${title}</h2><p class="lead">${desc}</p>`;
    const field=(label,key,placeholder,type='text')=>`<div class="field"><label for="f-${key}">${label}</label><input id="f-${key}" data-field="${key}" type="${type}" value="${esc(S[key])}" placeholder="${placeholder}" /></div>`;
    const summary=()=>`<div class="summary"><p>🎯 Цель: <b>${{friend:'Найти друга',date:'Найти пару',invite:'Пригласить знакомого'}[S.mode]}</b></p><p>👤 Участник: <b>${esc(S.name||'Гость')}</b></p><p>📅 Даты: <b>${S.days.map(x=>x+' ноября').join(', ')||'Не выбраны'}</b>, ${esc(S.time)}</p><p>📍 Место: <b>${venues[S.place].name}</b></p></div>`;
    const screens=[
      ()=>`<section class="screen center screen-enter"><span class="pill">✨ Встречаться стало проще</span><div class="hero-orbit">🤝</div><h1>Свободное время.<br/><span style="color:var(--violet)">Новые возможности.</span></h1><p class="lead">BothFree помогает находить время для настоящих встреч: с друзьями, новыми знакомыми или человеком, который тебе понравится.</p><div class="buttons">${button('Начать →',1)}${button('Вход для жюри',2,'secondary')}</div><p class="mini" style="margin-top:25px">13 интерактивных экранов · один клик для старта</p></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 1 / Намерение','Какую встречу ты ищешь?','Выбери сценарий, а мы предложим следующий шаг. Режим можно изменить позже.')}<div class="grid">${[['invite','💌','Пригласить знакомого','Создай приглашение для человека, с которым давно хотел встретиться.'],['friend','🫶','Найти нового друга','Знакомься с людьми по общим интересам и свободному времени.'],['date','💜','Найти пару','Ищи человека для знакомства и реальной встречи.']].map(([v,em,t,d])=>`<div class="tile selectable ${S.mode===v?'selected':''}" data-mode="${v}"><div class="emoji">${em}</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="buttons">${button('Продолжить →',2)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 2 / Доступ','Создай аккаунт или войди','Для демонстрации можно использовать любые данные. Пароль никуда не отправляется.')}<div class="switch"><button class="${!S.jury?'on':''}" data-jury="false">Участник</button><button class="${S.jury?'on':''}" data-jury="true">Жюри / демо</button></div>${S.jury?`<div class="summary"><h3>Просмотр без регистрации</h3><p>Режим жюри открывает экраны продукта без почты и пароля. Все действия выполняются локально в браузере.</p></div><div class="buttons"><button class="btn" data-action="jury-login">Открыть демо →</button></div>`:`<div class="form" style="margin-top:18px">${field('Электронная почта','email','you@example.com','email')}<div class="field"><label>Пароль</label><input type="password" placeholder="Любой пароль для демо" /></div><label class="check"><input type="checkbox" checked /> Я согласен с условиями демонстрации</label><div class="buttons"><button class="btn" data-action="login">Продолжить →</button></div></div>`}</section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 3 / Обо мне','Расскажи о себе','Небольшая анкета помогает другим людям понять, кто ты и что тебе интересно.')}<div class="form">${field('Имя','name','Как к тебе обращаться?')}<div class="grid two" style="margin:0"><div>${field('Возраст','age','Например, 24','number')}</div><div>${field('Город','city','Астана')}</div></div><div class="field"><label>Пару слов о себе</label><textarea data-field="bio" rows="4" placeholder="Люблю прогулки и разговоры за кофе">${esc(S.bio)}</textarea></div><div class="buttons">${button('Сохранить и дальше →',4)}</div></div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 4 / Интересы','Что тебе нравится?','Выбери несколько тем — они помогут подобрать компанию.')}<div class="row" style="max-width:650px;margin:15px 0">${['Кофе','Прогулки','Кино','Спорт','Книги','Музыка','Искусство','Игры','Путешествия','Еда','Технологии','Танцы'].map(x=>`<button class="tag ${S.interests.includes(x)?'on':''}" data-interest="${x}">${x}</button>`).join('')}</div><p class="mini">Выбрано: ${S.interests.length}</p><div class="buttons">${button('Выбрать свободное время →',5)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 5 / Календарь','Когда ты свободен?','Отметь удобные даты и время. В реальном приложении доступность будет синхронизироваться с календарем.')}<div class="section-head"><h3>Ноябрь 2026</h3><span class="pill">📅 Мой календарь</span></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="day">${x}</div>`).join('')}${Array(6).fill('<div></div>').join('')}${Array.from({length:30},(_,i)=>`<button class="date ${S.days.includes(i+1)?'on':''}" data-date="${i+1}">${i+1}</button>`).join('')}</div><h3 style="margin-top:25px">Удобное время</h3><div class="slots">${['12:00','15:00','18:00','20:00'].map(x=>`<button class="tag ${S.time===x?'on':''}" data-time="${x}">${x}</button>`).join('')}</div><div class="buttons">${button('Продолжить →',S.mode==='invite'?6:S.mode==='friend'?7:8)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Сценарий 1 / Знакомый','Пригласи знакомого','Поделись приглашением: человек сможет посмотреть детали и ответить.')}<div class="form">${field('Email друга (необязательно)','inviteEmail','friend@example.com','email')}<div class="field"><label>Сообщение</label><textarea id="inviteText" rows="4">Привет! Давай увидимся на неделе? Я свободен ${S.days.join(' и ')} ноября в ${S.time}. ☕</textarea></div><div class="buttons"><button class="btn" data-action="copy-invite">📋 Скопировать приглашение</button>${button('Выбрать место →',11,'secondary')}</div><div id="copyNotice" class="notice hidden">Текст приглашения скопирован.</div></div><div class="divider"></div><span class="mini">Письма не отправляются: это интерактивная демонстрация.</span></section>`,
      ()=>`<section class="screen screen-enter">${intro('Сценарий 2 / Дружба','Знакомства по интересам','Открой подбор людей, которые разделяют твои увлечения и предпочитают живое общение.')}<div class="grid">${people.map((p,i)=>`<div class="tile"><div class="emoji">${p.emoji}</div><h3>${p.name}, ${p.age}</h3><p>${p.info}</p><p><b>Общее:</b> ${p.common}</p><div class="buttons"><button class="btn secondary" data-person="${i}">Подробнее</button></div></div>`).join('')}</div><div class="buttons">${button('Посмотреть все совпадения →',9)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Сценарий 3 / Отношения','Найди свою пару','Знакомься в своем темпе. Общие интересы и подходящее время помогают проще предложить первую встречу.')}<div class="grid two"><div class="tile"><div class="emoji">💜</div><h3>Знакомство без спешки</h3><p>Сначала совпадение интересов и свободного времени, затем приглашение на встречу. Здесь показываем только демо-карточки.</p></div><div class="tile"><div class="emoji">🔒</div><h3>Взаимное согласие</h3><p>Контакты и встречи — только по согласию обоих пользователей.</p></div></div><div class="buttons">${button('Посмотреть людей →',9)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 6 / Совпадения','Кто тебе подходит?','Пример карточек подбора: общие интересы, совместимое время и предпочтения.')}<div class="grid">${people.map((p,i)=>`<div class="tile ${S.selectedPerson===i?'selected':''}"><span class="pill">${p.score} совпадение</span><div class="emoji" style="margin-top:16px">${p.emoji}</div><h3>${p.name}, ${p.age}</h3><p>${p.info}</p><p>✨ ${p.common}</p><div class="buttons"><button class="btn ${S.selectedPerson===i?'':'secondary'}" data-person="${i}">${S.selectedPerson===i?'Выбран(а)':'Выбрать'}</button></div></div>`).join('')}</div><div class="buttons">${button('Перейти к встрече →',10)}</div><p class="mini">Карточки вымышлены. Алгоритм подбора не подключен.</p></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 7 / Детали','Предложение встречи','Проверь информацию перед отправкой приглашения.')}<div class="grid two"><div class="tile"><div class="profile"><div class="avatar">${people[S.selectedPerson].emoji}</div><div><h3>${people[S.selectedPerson].name}, ${people[S.selectedPerson].age}</h3><div class="mini">${people[S.selectedPerson].score} совместимость</div></div></div><p>${people[S.selectedPerson].info}</p></div><div class="tile"><div class="emoji">🗓️</div><h3>План встречи</h3><p>${S.days.map(d=>d+' ноября').join(' или ')||'Дата не выбрана'} · ${S.time}</p><p>Город: ${esc(S.city||'Астана')}</p></div></div><h3>Что будем делать?</h3><div class="row">${['☕ Выпить кофе','🌳 Прогуляться','🎨 Посетить выставку'].map((t,i)=>`<button class="tag ${S.place===i?'on':''}" data-place="${i}">${t}</button>`).join('')}</div><div class="buttons">${button('Найти место на карте →',11)}</div></section>`,
      ()=>`<section class="screen screen-enter">${intro('Шаг 8 / Локация','Где встретимся?','Выбери вариант места. Это стилизованная схема, а не настоящая карта.')}<div class="mapbox" role="img" aria-label="Демонстрационная схема мест встречи"><span class="pin a">☕ Кофейня</span><span class="pin b">🌳 Парк</span><span class="pin c">🎨 Арт</span></div><div class="grid">${venues.map((v,i)=>`<div class="tile selectable ${S.place===i?'selected':''}" data-place="${i}"><div class="emoji">${v.icon}</div><h3>${v.name}</h3><p>${v.description}</p></div>`).join('')}</div><div class="buttons">${button('Подтвердить план →',12)}</div></section>`,
      ()=>`<section class="screen screen-enter ${S.confirmed?'center':''}">${S.confirmed?`<div class="hero-orbit">🎉</div><span class="pill">Готово!</span><h1>Встреча запланирована</h1><p class="lead">Демонстрационное подтверждение сохранено в этой вкладке. Настоящая встреча никому не отправлена.</p>${summary()}<div class="buttons"><button class="btn" data-action="restart">Создать новую встречу</button></div>`:`${intro('Шаг 9 / Проверка','Подтвердить план','Последний шаг: посмотри все детали и заверши демонстрационный сценарий.')}${summary()}<div class="field"><label class="check"><input type="checkbox" id="agree" /> Я понимаю, что это демонстрационная запись, а не реальная бронь или приглашение</label></div><div class="buttons"><button class="btn" data-action="confirm">✓ Подтвердить</button><button class="btn secondary" data-action="simulate-payment">Посмотреть оплату (демо)</button></div>${S.payment?'<div class="notice warn">💳 Оплата пока не подключена. Никакие средства не списываются.</div>':''}<div id="confirmError" class="notice warn hidden">Сначала отметь согласие с условиями демо.</div>`}</section>`
    ];
    function go(n){S.page=Math.max(0,Math.min(12,n));render();window.scrollTo({top:0,behavior:'smooth'})}
    function render(){
      $('nav').innerHTML=titles.map((x,i)=>`<button class="nav-item ${S.page===i?'active':''}" data-go="${i}"><span class="num">${i+1}</span>${x}</button>`).join('');
      $('viewport').innerHTML=screens[S.page]();$('breadcrumb').textContent=`Экран ${S.page+1} из ${titles.length} · ${titles[S.page]}`;$('prev').disabled=S.page===0;$('next').disabled=S.page===12;
    }
    document.addEventListener('input',e=>{let k=e.target.dataset.field;if(k)S[k]=e.target.value});
    document.addEventListener('click',async e=>{
      const b=e.target.closest('button,[data-mode],[data-place]');if(!b)return;
      if(b.dataset.go!==undefined)return go(Number(b.dataset.go));
      if(b.dataset.mode){S.mode=b.dataset.mode;return render()}
      if(b.dataset.jury){S.jury=b.dataset.jury==='true';return render()}
      if(b.dataset.interest){let v=b.dataset.interest;S.interests=S.interests.includes(v)?S.interests.filter(x=>x!==v):[...S.interests,v];return render()}
      if(b.dataset.date){let v=Number(b.dataset.date);S.days=S.days.includes(v)?S.days.filter(x=>x!==v):[...S.days,v].sort((a,b)=>a-b);return render()}
      if(b.dataset.time){S.time=b.dataset.time;return render()}
      if(b.dataset.person){S.selectedPerson=Number(b.dataset.person);return go(10)}
      if(b.dataset.place!==undefined){S.place=Number(b.dataset.place);return render()}
      switch(b.dataset.action){
        case'login':S.auth=true;return go(3);
        case'jury-login':S.auth=true;return go(3);
        case'copy-invite':{let content=$('inviteText').value;try{await navigator.clipboard.writeText(content);$('copyNotice').classList.remove('hidden')}catch{window.prompt('Скопируй текст:',content)}return}
        case'confirm':if(!$('agree').checked){$('confirmError').classList.remove('hidden');return}S.confirmed=true;return render();
        case'simulate-payment':S.payment=true;return render();
        case'restart':return reset();
      }
    });
    $('prev').onclick=()=>go(S.page-1);$('next').onclick=()=>go(S.page+1);$('resetBtn').onclick=reset;
    function reset(){Object.assign(S,{page:0,mode:'friend',name:'',email:'',city:'Астана',age:'',bio:'',interests:['Кофе','Прогулки'],days:[18,21],time:'18:00',selectedPerson:0,place:0,inviteEmail:'',auth:false,jury:false,confirmed:false,payment:false});render()}
    render();
  </script>
</body>
</html>
